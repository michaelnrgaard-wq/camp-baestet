<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Siden blev ikke fundet · Camp Bæstet</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
  <style>
    @import url('https://fonts.cdnfonts.com/css/cloister-black');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #c9a84c;
      --dark: #0a0805;
      --text: #d4c4a0;
      --muted: #7a6a50;
      --blackletter: 'Cloister Black', serif;
    }

    body {
      background: var(--dark);
      color: var(--text);
      font-family: 'Georgia', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .glyph {
      font-size: 5rem;
      margin-bottom: 1.5rem;
      opacity: 0.3;
    }

    h1 {
      font-family: var(--blackletter);
      font-size: clamp(2.5rem, 8vw, 5rem);
      color: var(--gold);
      font-weight: 400;
      margin-bottom: 0.5rem;
    }

    .sub {
      font-size: 0.75rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }

    p {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.7;
      max-width: 400px;
      margin-bottom: 2.5rem;
    }

    .divider {
      width: 80px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 1.5rem auto;
    }

    a.btn {
      display: inline-block;
      padding: 0.7rem 2rem;
      font-family: var(--blackletter);
      font-size: 0.95rem;
      letter-spacing: 0.06em;
      text-decoration: none;
      border-radius: 2px;
      background: var(--gold);
      color: var(--dark);
      transition: all 0.3s;
    }

    a.btn:hover {
      background: #e8c96a;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(201,168,76,0.35);
    }

    /* ── Ild-glød + entrance (matcher resten af sitet) ── */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(120% 60% at 50% 118%, rgba(200,96,26,0.16), transparent 60%),
        radial-gradient(100% 50% at 50% -10%, rgba(201,168,76,0.06), transparent 55%);
      animation: ambient-pulse 7s ease-in-out infinite;
    }
    @keyframes ambient-pulse { 0%,100% { opacity: 0.65; } 50% { opacity: 1; } }

    @keyframes rise {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes draw-line { to { transform: scaleX(1); } }
    @keyframes rise-glyph {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 0.3; transform: translateY(0); }
    }
    .glyph   { opacity: 0; animation: rise-glyph 0.8s cubic-bezier(0.2,0.8,0.2,1) 0.10s forwards; }
    h1       { opacity: 0; animation: rise 0.9s cubic-bezier(0.2,0.8,0.2,1) 0.20s forwards; }
    .divider { transform: scaleX(0); animation: draw-line 1s cubic-bezier(0.2,0.8,0.2,1) 0.40s forwards; }
    .sub, p  { opacity: 0; animation: rise 0.9s ease 0.45s forwards; }
    a.btn    { opacity: 0; animation: rise 0.9s ease 0.60s forwards; }

    @media (prefers-reduced-motion: reduce) {
      body::before { animation: none; }
      .glyph { opacity: 0.3; animation: none; }
      h1, .sub, p, a.btn { opacity: 1; animation: none; }
      .divider { transform: none; animation: none; }
    }
  </style>
</head>
<body>
  <div class="glyph">⚔</div>
  <h1>404</h1>
  <div class="divider"></div>
  <p class="sub">Siden eksisterer ikke</p>
  <p>Du er vandret for langt fra borgen. Denne side findes ikke — men kongeriget gør.</p>
  <a href="/" class="btn">Tilbage til forsiden</a>
</body>
</html>
