<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Siden blev ikke fundet · Camp Bæstet</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
  <style>
    @import url('https://fonts.cdnfonts.com/css/cloister-black');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #c9a84c;
      --dark: #0a0805;
      --text: #d4c4a0;
      --muted: #7a6a50;
      --blackletter: 'Cloister Black', serif;
    }

    body {
      background: var(--dark);
      color: var(--text);
      font-family: 'Georgia', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .glyph {
      font-size: 5rem;
      margin-bottom: 1.5rem;
      opacity: 0.3;
    }

    h1 {
      font-family: var(--blackletter);
      font-size: clamp(2.5rem, 8vw, 5rem);
      color: var(--gold);
      font-weight: 400;
      margin-bottom: 0.5rem;
    }

    .sub {
      font-size: 0.75rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }

    p {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.7;
      max-width: 400px;
      margin-bottom: 2.5rem;
    }

    .divider {
      width: 80px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 1.5rem auto;
    }

    a.btn {
      display: inline-block;
      padding: 0.7rem 2rem;
      font-family: var(--blackletter);
      font-size: 0.95rem;
      letter-spacing: 0.06em;
      text-decoration: none;
      border-radius: 2px;
      background: var(--gold);
      color: var(--dark);
      transition: all 0.3s;
    }

    a.btn:hover {
      background: #e8c96a;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(201,168,76,0.35);
    }
  </style>
</head>
<body>
  <div class="glyph">⚔</div>
  <h1>404</h1>
  <div class="divider"></div>
  <p class="sub">Siden eksisterer ikke</p>
  <p>Du er vandret for langt fra borgen. Denne side findes ikke — men kongeriget gør.</p>
  <a href="/" class="btn">Tilbage til forsiden</a>
</body>
</html>
