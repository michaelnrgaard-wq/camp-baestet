  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold:       #c9a84c;
      --gold2:      #e8c96a;
      --dark:       #0a0805;
      --stone:      #1e1912;
      --text:       #d4c4a0;
      --muted:      #7a6a50;
      --blackletter: 'Cloister Black', serif;
    }

    html { scroll-behavior: smooth; }
    body { background: var(--dark); color: var(--text); font-family: 'Georgia', serif; overflow-x: hidden; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--dark); }
    ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 3px; }

    /* ── Nav ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 3rem; height: 68px;
      background: rgba(5,3,2,0.97);
      border-bottom: 1px solid rgba(201,168,76,0.2);
      backdrop-filter: blur(12px);
    }

    .nav-logo { font-family: var(--blackletter); font-size: 1.5rem; color: var(--gold); text-decoration: none; text-shadow: 0 0 20px rgba(201,168,76,0.4); }

    .nav-links { display: flex; gap: 0.3rem; list-style: none; }

    .nav-links a {
      font-family: var(--blackletter); color: var(--text); text-decoration: none;
      font-size: 0.95rem; letter-spacing: 0.04em; padding: 0.45rem 1.1rem;
      border: 1px solid transparent; border-radius: 2px;
      transition: all 0.25s; position: relative;
    }

    .nav-links a::after {
      content: ''; position: absolute; bottom: -1px; left: 50%; right: 50%;
      height: 1px; background: var(--gold); transition: all 0.25s;
    }

    .nav-links a:hover { color: var(--gold); }
    .nav-links a:hover::after { left: 10%; right: 10%; }
    .nav-links a.active { color: var(--gold); }
    .nav-links a.active::after { left: 10%; right: 10%; }

    .nav-right { display: flex; align-items: center; gap: 0.4rem; }
    .nav-socials { display: flex; gap: 0.6rem; align-items: center; margin-left: 1rem; }
    .nav-socials a { display: flex; align-items: center; color: var(--muted); transition: color 0.25s; }
    .nav-socials a:hover { color: var(--gold); }
    .nav-socials svg { width: 16px; height: 16px; fill: currentColor; }

    .nav-hamburger {
      display: none; flex-direction: column; gap: 5px;
      cursor: pointer; padding: 0.3rem; background: none; border: none;
    }
    .nav-hamburger span { display: block; width: 22px; height: 1px; background: var(--gold); transition: all 0.3s; }
    .nav-hamburger.open span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
    .nav-hamburger.open span:nth-child(2) { opacity: 0; }
    .nav-hamburger.open span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }

    .nav-mobile {
      display: none; position: fixed; top: 68px; left: 0; right: 0;
      background: rgba(5,3,2,0.98); border-bottom: 1px solid rgba(201,168,76,0.2);
      backdrop-filter: blur(12px); padding: 1.5rem 2rem 2rem;
      z-index: 99; flex-direction: column; gap: 0.5rem;
    }
    .nav-mobile.open { display: flex; }
    .nav-mobile a { font-family: var(--blackletter); color: var(--text); text-decoration: none; font-size: 1.3rem; padding: 0.5rem 0; border-bottom: 1px solid rgba(201,168,76,0.08); transition: color 0.2s; }
    .nav-mobile a:hover, .nav-mobile a.active { color: var(--gold); }
    .nav-mobile-socials { display: flex; gap: 1rem; padding-top: 1rem; }
    .nav-mobile-socials a { border-bottom: none; font-size: 0.75rem; letter-spacing: 0.15em; text-transform: uppercase; display: flex; align-items: center; gap: 0.4rem; color: var(--muted); }
    .nav-mobile-socials svg { width: 14px; height: 14px; fill: currentColor; }

    /* ── Page header ── */
    .page-header {
      margin-top: 68px; padding: 5rem 2rem 3rem;
      text-align: center; position: relative; overflow: hidden;
    }
    .page-header::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse 70% 80% at 50% 50%, rgba(201,168,76,0.05) 0%, transparent 70%);
      pointer-events: none;
    }
    .page-header .label { font-family: var(--blackletter); font-size: 0.85rem; color: var(--gold); letter-spacing: 0.08em; display: block; margin-bottom: 0.6rem; }
    .page-header h1 { font-family: var(--blackletter); font-size: clamp(2.5rem, 7vw, 5rem); color: #fff; font-weight: 400; line-height: 1.05; text-shadow: 0 0 60px rgba(201,168,76,0.2); }
    .page-header .divider { width: 80px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); margin: 1.5rem auto; }
    .page-header p { font-size: 0.95rem; color: var(--muted); max-width: 500px; margin: 0 auto; line-height: 1.7; }

    /* ── Gallery ── */
    .gallery-section { padding: 2rem 2rem 6rem; max-width: 1300px; margin: 0 auto; }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1rem;
    }

    .gallery-item {
      aspect-ratio: 4/3;
      background: linear-gradient(160deg, #1e1510 0%, #2d1e0f 50%, #1a100a 100%);
      border: 1px solid rgba(201,168,76,0.12);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
      transition: border-color 0.4s, box-shadow 0.4s;
      cursor: pointer;
    }

    .gallery-item img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
      transition: transform 0.5s ease;
    }

    .gallery-item:hover { border-color: rgba(201,168,76,0.45); box-shadow: 0 8px 30px rgba(0,0,0,0.6); }
    .gallery-item:hover img { transform: scale(1.04); }

    /* ── Lightbox ── */
    .lightbox {
      display: none; position: fixed; inset: 0; z-index: 999;
      background: rgba(5,3,2,0.95); align-items: center; justify-content: center;
      cursor: zoom-out;
    }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 90vw; max-height: 90vh; object-fit: contain; border: 1px solid rgba(201,168,76,0.2); }
    .lightbox-close {
      position: absolute; top: 1.5rem; right: 2rem;
      font-family: var(--blackletter); font-size: 2rem;
      color: var(--gold); cursor: pointer; line-height: 1;
    }

    /* ── Reveal ── */
    .reveal { opacity: 0; transform: translateY(30px); transition: opacity 0.7s ease, transform 0.7s ease; }
    .reveal.visible { opacity: 1; transform: translateY(0); }

    /* ── Footer ── */
    footer { border-top: 1px solid rgba(201,168,76,0.15); padding: 3rem 2rem; text-align: center; }
    .footer-logo { font-family: var(--blackletter); font-size: 1.8rem; color: var(--gold); margin-bottom: 0.5rem; }
    footer p { font-size: 0.75rem; color: var(--muted); letter-spacing: 0.15em; text-transform: uppercase; }
    footer a { color: var(--muted); text-decoration: none; transition: color 0.2s; }
    footer a:hover { color: var(--gold); }

    /* ── Guld-shimmer på logoer ── */
    .shimmer {
      background: linear-gradient(100deg, var(--gold) 0%, var(--gold) 38%, #fff4cf 50%, var(--gold) 62%, var(--gold) 100%);
      background-size: 250% 100%;
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      animation: shimmer-sweep 7s ease-in-out infinite;
    }
    @keyframes shimmer-sweep { 0%,100% { background-position: 160% 0; } 50% { background-position: -60% 0; } }

    /* ── Film-grain ── */
    .grain {
      position: fixed; top: -50%; left: -50%; width: 200%; height: 200%;
      z-index: 9998; pointer-events: none; opacity: 0.05;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
      animation: grain 0.6s steps(2) infinite;
    }
    @keyframes grain {
      0% { transform: translate(0,0); } 25% { transform: translate(-4%,3%); }
      50% { transform: translate(3%,-4%); } 75% { transform: translate(-3%,-2%); }
      100% { transform: translate(2%,4%); }
    }

    /* ── Sideovergang ── */
    .curtain {
      position: fixed; inset: 0; z-index: 9997; pointer-events: none;
      transform: translateY(100%);
      background: linear-gradient(180deg, #15100a 0%, var(--dark) 100%);
      transition: transform 0.6s cubic-bezier(0.7, 0, 0.25, 1);
    }
    .curtain.cover { transform: translateY(0); }
    .curtain.reveal { transform: translateY(-100%); }
    .curtain::after {
      content: '⚜'; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      font-family: var(--blackletter); font-size: 3rem; color: var(--gold); opacity: 0;
      transition: opacity 0.3s ease; text-shadow: 0 0 30px rgba(201,168,76,0.5);
    }
    .curtain.cover::after { opacity: 0.9; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important;
      }
      .grain, .curtain { display: none; }
    }

    @media (max-width: 600px) {
      nav { padding: 0 1.2rem; }
      .nav-logo { font-size: 1.1rem; white-space: nowrap; }
      .nav-links, .nav-socials { display: none; }
      .nav-hamburger { display: flex; }
      .nav-right { gap: 0; }
      .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 0.5rem; }
    }
  </style>
</head>

  <script>
    // ── Hamburger ──
    const hamburger = document.getElementById('hamburger');
    const navMobile = document.getElementById('navMobile');
    hamburger.addEventListener('click', () => {
      hamburger.classList.toggle('open');
      navMobile.classList.toggle('open');
    });
    navMobile.querySelectorAll('a').forEach(a => {
      a.addEventListener('click', () => {
        hamburger.classList.remove('open');
        navMobile.classList.remove('open');
      });
    });

    // ── Lightbox ──
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    document.querySelectorAll('.gallery-item img').forEach(img => {
      img.addEventListener('click', () => {
        lightboxImg.src = img.src;
        lightbox.classList.add('open');
      });
    });
    document.getElementById('lightboxClose').addEventListener('click', () => lightbox.classList.remove('open'));
    lightbox.addEventListener('click', (e) => { if (e.target === lightbox) lightbox.classList.remove('open'); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') lightbox.classList.remove('open'); });

    // ── Scroll reveal ──
    const reveals = document.querySelectorAll('.reveal');
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); }
      });
    }, { threshold: 0.08 });
    reveals.forEach(el => io.observe(el));

    // ── Sideovergang (gardin) ──
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const curtain = document.getElementById('curtain');
    function revealPage() {
      if (!curtain) return;
      curtain.classList.add('cover');
      requestAnimationFrame(() => requestAnimationFrame(() => {
        curtain.classList.remove('cover');
        curtain.classList.add('reveal');
        setTimeout(() => curtain.classList.remove('reveal'), 700);
      }));
    }
    function isInternal(a) {
      if (!a || a.target === '_blank' || a.hasAttribute('download')) return false;
      const href = a.getAttribute('href') || '';
      if (href.startsWith('#') || href.startsWith('mailto:') || href.startsWith('tel:')) return false;
      return a.hostname === window.location.hostname;
    }
    if (!reduce && curtain) {
      window.addEventListener('pageshow', revealPage);
      document.addEventListener('click', e => {
        const a = e.target.closest('a');
        if (!isInternal(a)) return;
        e.preventDefault();
        curtain.classList.remove('reveal');
        curtain.classList.add('cover');
        setTimeout(() => { window.location.href = a.href; }, 560);
      });
    }
  </script>
